<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="别踩白块 Piano Tiles Logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e11d48"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- 圆角徽章背景 -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- 四个钢琴键（游戏列网格） -->
  <g opacity="0.16">
    <rect x="64"  y="88" width="80" height="336" rx="18" fill="#ffffff"/>
    <rect x="160" y="88" width="80" height="336" rx="18" fill="#ffffff"/>
    <rect x="256" y="88" width="80" height="336" rx="18" fill="#ffffff"/>
    <rect x="352" y="88" width="80" height="336" rx="18" fill="#ffffff"/>
  </g>

  <!-- 正在下落的黑色方块（主题色） -->
  <g transform="rotate(-8 256 256)">
    <rect x="170" y="150" width="172" height="228" rx="30" fill="url(#accent)"/>
    <rect x="170" y="150" width="172" height="228" rx="30" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3"/>
  </g>

  <!-- 白色音符（双八分音符） -->
  <g fill="#ffffff">
    <rect x="232" y="196" width="13" height="116" rx="6"/>
    <rect x="299" y="196" width="13" height="116" rx="6"/>
    <path d="M232 200 L312 190 L312 212 L232 222 Z"/>
    <ellipse cx="247" cy="310" rx="19" ry="12" transform="rotate(-15 247 310)"/>
    <ellipse cx="314" cy="310" rx="19" ry="12" transform="rotate(-15 314 310)"/>
  </g>
</svg>
